<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestión de Ventas</title>
  <link rel="stylesheet" href="css/ventas.css">
</head>
<body>
  <header>
    <div class="navbar">
      <h1>CRM - Ventas</h1>
      <a href="index.html" class="logout">Cerrar Sesión</a>
    </div>
  </header>

  <div class="container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <ul>
        <li><a href="index.html" class="active">Dashboard</a></li>
        <li><a href="clientes.html">Clientes</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="ventas.html">Ventas</a></li>
        <li><a href="usuarios.html">Usuarios</a></li>
        <li><a href="soporte.html">Soporte</a></li>
        <li><a href="reportes.html">Reportes</a></li>
      </ul>
    </aside>

    <!-- Contenido principal -->
    <main class="content">
      <h2>Gestión de Ventas</h2>

      <form id="ventaForm">
        <input type="text" id="clienteVenta" placeholder="Cliente" required>
        <input type="text" id="productoVenta" placeholder="Producto" required>
        <input type="number" id="cantidadVenta" placeholder="Cantidad" required>
        <button type="submit">Registrar Venta</button>
      </form>

      <table id="ventasTable">
        <thead>
          <tr>
            <th>Cliente</th>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Total</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <!-- Datos dummies -->
          <tr>
            <td>Juan Pérez</td>
            <td>Producto A</td>
            <td>2</td>
            <td>240</td>
            <td>
              <button class="edit">Editar</button>
              <button class="delete">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </main>
  </div>

  <script src="ventas.js"></script>
</body>
</html>
