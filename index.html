<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CRM - Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <div class="navbar">
      <h1>CRM</h1>
      <a href="login.html" class="logout">Cerrar Sesión</a>
    </div>
  </header>

  <div class="container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <ul>
        <li><a href="index.html" class="active">Dashboard</a></li>
        <li><a href="clientes.html">Clientes</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="ventas.html">Ventas</a></li>
        <li><a href="usuarios.html">Usuarios</a></li>
        <li><a href="soporte.html">Soporte</a></li>
        <li><a href="reportes.html">Reportes</a></li>
      </ul>
    </aside>

    <!-- Contenido principal -->
    <main class="content">
      <h2>Bienvenido al CRM</h2>
      <p>Aquí tienes una vista general de tu negocio 🚀</p>

      <!-- KPIs -->
      <div class="kpi-container">
        <div class="kpi-card">
          <h3>Clientes</h3>
          <p id="totalClientes">150</p>
        </div>
        <div class="kpi-card">
          <h3>Productos</h3>
          <p id="totalProductos">45</p>
        </div>
        <div class="kpi-card">
          <h3>Ventas</h3>
          <p id="totalVentas">320</p>
        </div>
        <div class="kpi-card">
          <h3>Usuarios</h3>
          <p id="totalUsuarios">12</p>
        </div>
      </div>

      <!-- Gráficas -->
      <div class="charts">
        <canvas id="ventasChart"></canvas>
        <canvas id="clientesChart"></canvas>
      </div>
    </main>
  </div>

  <script src="index.js"></script>
</body>
</html>
